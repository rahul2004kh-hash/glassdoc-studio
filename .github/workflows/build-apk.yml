name: Build GlassDoc v2.1 Signed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle offline libraries and Bengali fonts
        run: npm run prepare-assets

      - name: Add Android platform & sync assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch Native Fullscreen, PDF Scanner & Release Signing
        run: node scripts/prepare-assets.js --patch-android

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/glassdoc-release.keystore \
            -alias glassdoc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass GlassDoc2026 -keypass GlassDoc2026 \
            -dname "CN=GlassDoc Studio, OU=Student Initiative, O=GlassDoc NonProfit, L=Jhenaidah, S=Khulna, C=BD"

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Signed APK for download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/GlassDoc-Studio-v2.1-Signed.apk
          ls -lh release/GlassDoc-Studio-v2.1-Signed.apk

      - name: Upload GlassDoc v2.1 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassDoc-Studio-v2.1-APK
          path: release/GlassDoc-Studio-v2.1-Signed.apk
          retention-days: 30
