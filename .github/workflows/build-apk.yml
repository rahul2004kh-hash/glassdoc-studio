name: Build AetherX PDF Reader v3.1 Secure APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle & verify 100% offline libraries and Bengali fonts
        run: npm run prepare-assets

      - name: Add Android platform & sync assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch Native Security, Streaming PDF Engine & Env Signing
        run: node scripts/prepare-assets.js --patch-android

      - name: Apply Custom AetherX App Icons (All Densities + Adaptive)
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          src_path = "app-icon.png"
          if not os.path.exists(src_path):
              print("No app-icon.png found, keeping default icon.")
              raise SystemExit(0)

          src = Image.open(src_path).convert("RGBA")
          res_root = "android/app/src/main/res"

          legacy_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          adaptive_sizes = {
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }

          def make_round(img_sq):
              s = img_sq.size[0]
              mask = Image.new("L", (s, s), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, s - 1, s - 1), fill=255)
              out = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              out.paste(img_sq, (0, 0), mask)
              return out

          for folder, sz in legacy_sizes.items():
              out_dir = os.path.join(res_root, folder)
              os.makedirs(out_dir, exist_ok=True)
              sq = src.resize((sz, sz), Image.Resampling.LANCZOS)
              sq.save(os.path.join(out_dir, "ic_launcher.png"), "PNG", optimize=True)
              make_round(sq).save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG", optimize=True)

          for folder, sz in adaptive_sizes.items():
              out_dir = os.path.join(res_root, folder)
              os.makedirs(out_dir, exist_ok=True)
              fg = Image.new("RGBA", (sz, sz), (0, 0, 0, 0))
              inner_sz = int(sz * 0.72)
              inner = src.resize((inner_sz, inner_sz), Image.Resampling.LANCZOS)
              r = int(inner_sz * 0.22)
              mask = Image.new("L", (inner_sz, inner_sz), 0)
              ImageDraw.Draw(mask).rounded_rectangle((0, 0, inner_sz - 1, inner_sz - 1), radius=r, fill=255)
              offset = (sz - inner_sz) // 2
              fg.paste(inner, (offset, offset), mask)
              fg.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG", optimize=True)

          print("All custom AetherX launcher icons generated successfully!")
          PYEOF

      - name: Prepare Secure Signing Keystore (GitHub Secrets or Ephemeral Random Key)
        id: signing
        env:
          SECRET_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          KS_FILE="$RUNNER_TEMP/aetherx-signing.keystore"
          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "Using permanent Release Keystore from GitHub Repository Secrets!"
            echo "$SECRET_KS_B64" | base64 --decode > "$KS_FILE"
            echo "KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::notice::GitHub Secrets not set yet. Generating ephemeral random-password keystore (zero hardcoded credentials)."
            RAND_PASS=$(openssl rand -hex 16)
            ALIAS_VAL="${SECRET_KEY_ALIAS:-aetherx}"
            PASS_VAL="${SECRET_KS_PASS:-$RAND_PASS}"
            KPASS_VAL="${SECRET_KEY_PASS:-$PASS_VAL}"
            keytool -genkeypair -noprompt               -keystore "$KS_FILE"               -alias "$ALIAS_VAL"               -keyalg RSA -keysize 2048 -validity 10000               -storepass "$PASS_VAL" -keypass "$KPASS_VAL"               -dname "CN=AetherX PDF Reader, OU=Personal Offline Studio, O=AetherX, C=BD"
            echo "KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$PASS_VAL" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ALIAS_VAL" >> "$GITHUB_ENV"
            echo "KEY_PASS=$KPASS_VAL" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Signed APK for download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/AetherX-PDF-Reader-v3.1-Secure.apk
          ls -lh release/AetherX-PDF-Reader-v3.1-Secure.apk

      - name: Upload AetherX v3.1 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-PDF-Reader-v3.1-APK
          path: release/AetherX-PDF-Reader-v3.1-Secure.apk
          retention-days: 30
